[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pantheon-ical"
version = "0.1.1"
description = "Round-trip iCal (RFC 5545) read + write for booking/availability calendars, in under 200 lines."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Teague Frayling" }]
keywords = ["ical", "icalendar", "rfc5545", "booking", "availability", "calendar", "airbnb", "sync"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = ["python-dateutil>=2.8"]

[project.urls]
Homepage = "https://github.com/Igfray/pantheon-ical"

[tool.hatch.build.targets.wheel]
only-include = ["pantheon_ical.py"]

[tool.hatch.build.targets.sdist]
include = ["pantheon_ical.py", "test_pantheon_ical.py", "README.md", "LICENSE", "NOTICE"]
